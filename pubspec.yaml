name: netflix_happ
description: Flutter app flow based on the supplied NetflixHapp iOS source, with a Netflix Thailand WebView.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/LoadingVideo.mp4
