name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS runner project when absent
        shell: bash
        run: |
          flutter create --platforms=ios --org com.example --project-name netflixhapp .
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName NetflixHapp' ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string NetflixHapp' ios/Runner/Info.plist

      - name: Resolve packages
        run: flutter pub get

      - name: Build iOS app without code signing
        shell: bash
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee "$RUNNER_TEMP/flutter-ios-build.log"
          build_status=${PIPESTATUS[0]}
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ "$build_status" -ne 0 ]; then
            if ! grep -Fq 'Building a deployable iOS app requires a selected Development Team' "$RUNNER_TEMP/flutter-ios-build.log"; then
              exit "$build_status"
            fi
            echo "Flutter reported a signing-profile validation error; verifying the unsigned app bundle produced by Xcode."
          fi

          if [ ! -d "$APP_PATH" ]; then
            DERIVED_DATA="$RUNNER_TEMP/netflixhapp-derived"
            DIRECT_APP="$DERIVED_DATA/Build/Products/Release-iphoneos/Runner.app"
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY='' \
              build
            test -d "$DIRECT_APP"
            mkdir -p "$(dirname "$APP_PATH")"
            cp -R "$DIRECT_APP" "$APP_PATH"
          fi

          test -d "$APP_PATH"
          test -s "$APP_PATH/Runner"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist"

      - name: Package unsigned IPA for re-signing
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          OUTPUT_DIR="build/ios/ipa"
          STAGING_DIR="$RUNNER_TEMP/ipa-staging"
          test -d "$APP_PATH"
          mkdir -p "$OUTPUT_DIR" "$STAGING_DIR/Payload"
          cp -R "$APP_PATH" "$STAGING_DIR/Payload/Runner.app"
          IPA_PATH="$OUTPUT_DIR/NetflixHapp-unsigned.ipa"
          ditto -c -k --keepParent --sequesterRsrc "$STAGING_DIR/Payload" "$IPA_PATH"
          test -s "$IPA_PATH"
          unzip -t "$IPA_PATH"
          unzip -Z1 "$IPA_PATH" | grep -qx 'Payload/Runner.app/Info.plist'

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetflixHapp-unsigned-ipa
          path: build/ios/ipa/NetflixHapp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
