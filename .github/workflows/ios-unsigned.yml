name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS runner project when absent
        run: flutter create --platforms=ios --org com.example --project-name proxyutility .

      - name: Resolve packages
        run: flutter pub get

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA for re-signing
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          OUTPUT_DIR="build/ios/ipa"
          STAGING_DIR="$RUNNER_TEMP/ipa-staging"
          test -d "$APP_PATH"
          mkdir -p "$OUTPUT_DIR" "$STAGING_DIR/Payload"
          cp -R "$APP_PATH" "$STAGING_DIR/Payload/Runner.app"
          IPA_PATH="$OUTPUT_DIR/ProxyUtilityStarter-unsigned.ipa"
          ditto -c -k --keepParent --sequesterRsrc "$STAGING_DIR/Payload" "$IPA_PATH"
          test -s "$IPA_PATH"
          unzip -t "$IPA_PATH"
          unzip -Z1 "$IPA_PATH" | grep -qx 'Payload/Runner.app/Info.plist'

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyUtilityStarter-unsigned-ipa
          path: build/ios/ipa/ProxyUtilityStarter-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
